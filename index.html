<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Lembrete por Voz</title>
  <meta name="theme-color" content="#0a0a0f"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Lembrete"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: rgba(255,255,255,0.07);
      --accent: #7c6af7;
      --accent2: #f76a8a;
      --green: #3dffa0;
      --yellow: #ffd166;
      --text: #e8e8f0;
      --muted: #5a5a70;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── Grain overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* ── Header ── */
    header {
      position: relative; z-index: 1;
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px;
    }
    .header-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
      box-shadow: 0 0 24px rgba(124,106,247,0.4);
    }
    header h1 {
      font-family: var(--mono);
      font-size: 1.05rem; font-weight: 700;
      letter-spacing: -0.3px; color: var(--text);
    }
    header p {
      font-size: 0.73rem; color: var(--muted);
      margin-top: 2px; font-weight: 300;
    }

    /* ── Wake Lock indicator ── */
    #wakelock-dot {
      margin-left: auto; flex-shrink: 0;
      display: flex; align-items: center; gap: 5px;
      font-size: 0.68rem; color: var(--muted);
      font-family: var(--mono);
    }
    #wakelock-dot .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      transition: background 0.3s;
    }
    #wakelock-dot.active .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #wakelock-dot.active { color: var(--green); }

    /* ── Main ── */
    main { position: relative; z-index: 1; padding: 24px 20px 120px; max-width: 480px; margin: 0 auto; }

    /* ── Mic button ── */
    #btn-falar {
      width: 100%; height: 80px;
      background: transparent;
      border: 2px solid rgba(124,106,247,0.4);
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 1rem; font-weight: 700;
      color: var(--accent);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      transition: all 0.2s;
      position: relative; overflow: hidden;
      letter-spacing: 0.5px;
    }
    #btn-falar::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(124,106,247,0.08), rgba(247,106,138,0.05));
      opacity: 0; transition: opacity 0.2s;
    }
    #btn-falar:hover::before { opacity: 1; }
    #btn-falar:active { transform: scale(0.98); }
    #btn-falar.ouvindo {
      border-color: var(--accent2);
      color: var(--accent2);
      animation: borderPulse 1.2s ease-in-out infinite;
    }
    @keyframes borderPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(247,106,138,0); border-color: rgba(247,106,138,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(247,106,138,0.1); border-color: rgba(247,106,138,0.9); }
    }

    .mic-waves {
      display: none; align-items: center; gap: 3px; height: 20px;
    }
    .mic-waves span {
      display: block; width: 3px; border-radius: 2px;
      background: var(--accent2);
      animation: wave 0.8s ease-in-out infinite;
    }
    .mic-waves span:nth-child(1) { height: 6px;  animation-delay: 0s; }
    .mic-waves span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
    .mic-waves span:nth-child(3) { height: 10px; animation-delay: 0.2s; }
    .mic-waves span:nth-child(4) { height: 18px; animation-delay: 0.15s; }
    .mic-waves span:nth-child(5) { height: 8px;  animation-delay: 0.05s; }
    @keyframes wave { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }
    #btn-falar.ouvindo .mic-waves { display: flex; }

    /* ── Status ── */
    #status-texto {
      margin-top: 12px; margin-bottom: 24px;
      font-size: 0.82rem; color: var(--muted);
      font-family: var(--mono);
      min-height: 20px;
      transition: color 0.2s;
      padding-left: 2px;
    }
    #status-texto.ativo { color: var(--text); }
    #status-texto.ok    { color: var(--green); }
    #status-texto.warn  { color: var(--yellow); }

    /* ── System status bar ── */
    #sys-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 12px;
      font-size: 0.73rem; font-family: var(--mono);
      border: 1px solid var(--border);
      background: var(--surface);
      margin-bottom: 28px;
      transition: all 0.3s;
    }
    #sys-bar .sys-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      transition: all 0.3s;
    }
    #sys-bar.ok   { border-color: rgba(61,255,160,0.2); }
    #sys-bar.ok   .sys-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #sys-bar.ok   .sys-label { color: var(--green); }
    #sys-bar.warn { border-color: rgba(255,209,102,0.2); }
    #sys-bar.warn .sys-dot { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
    #sys-bar.warn .sys-label { color: var(--yellow); }
    #sys-bar.err  { border-color: rgba(247,106,138,0.2); }
    #sys-bar.err  .sys-dot { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
    #sys-bar.err  .sys-label { color: var(--accent2); }
    .sys-label { font-weight: 700; }
    .sys-msg { color: var(--muted); margin-left: 2px; }
    #btn-notif {
      margin-left: auto; flex-shrink: 0;
      background: rgba(124,106,247,0.15);
      border: 1px solid rgba(124,106,247,0.3);
      border-radius: 6px; padding: 5px 9px;
      font-size: 0.68rem; font-family: var(--mono);
      color: var(--accent); cursor: pointer;
      transition: all 0.15s; white-space: nowrap;
      display: none;
    }
    #btn-notif.show { display: block; }
    #btn-notif:active { transform: scale(0.95); }

    /* ── Section ── */
    .section-title {
      font-family: var(--mono);
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px;
    }

    /* ── Lembrete cards ── */
    .lembrete-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 14px;
      animation: cardIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
      transition: border-color 0.3s;
    }
    .lembrete-card.disparando {
      border-color: rgba(61,255,160,0.4);
      animation: cardIn 0.3s both, cardGlow 0.6s ease-in-out;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes cardGlow {
      0%,100% { box-shadow: none; }
      50% { box-shadow: 0 0 20px rgba(61,255,160,0.3); }
    }
    .card-time {
      font-family: var(--mono); font-size: 0.68rem;
      color: var(--muted); min-width: 38px; flex-shrink: 0;
    }
    .card-text {
      flex: 1; font-size: 0.88rem; font-weight: 400;
      color: var(--text); line-height: 1.4;
    }
    .badge {
      flex-shrink: 0;
      font-family: var(--mono); font-size: 0.68rem; font-weight: 700;
      padding: 4px 9px; border-radius: 8px; white-space: nowrap;
    }
    .badge-countdown {
      background: rgba(124,106,247,0.15);
      border: 1px solid rgba(124,106,247,0.3);
      color: var(--accent);
    }
    .badge-fired {
      background: rgba(61,255,160,0.1);
      border: 1px solid rgba(61,255,160,0.25);
      color: var(--green);
    }
    .badge-notime {
      background: rgba(255,209,102,0.1);
      border: 1px solid rgba(255,209,102,0.2);
      color: var(--yellow);
    }

    /* ── Vazio ── */
    .empty {
      text-align: center; padding: 40px 0;
      font-family: var(--mono); font-size: 0.8rem;
      color: var(--muted);
    }
    .empty::before { content: '···'; display: block; font-size: 1.5rem; margin-bottom: 10px; }

    /* ── Alarm overlay ── */
    #alarm-overlay {
      display: none; position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      align-items: center; justify-content: center; flex-direction: column;
      gap: 20px; padding: 30px;
      animation: alarmIn 0.4s cubic-bezier(0.34,1.4,0.64,1);
    }
    #alarm-overlay.show { display: flex; }
    @keyframes alarmIn { from{opacity:0;transform:scale(0.8)} to{opacity:1;transform:none} }
    #alarm-ring { font-size: 4rem; animation: ring 0.5s ease-in-out infinite alternate; }
    @keyframes ring { from{transform:rotate(-15deg)} to{transform:rotate(15deg)} }
    #alarm-texto {
      font-size: 1.1rem; font-weight: 500; text-align: center;
      color: white; max-width: 300px; line-height: 1.5;
    }
    #btn-dismiss {
      margin-top: 10px;
      background: white; color: #0a0a0f;
      border: none; border-radius: 14px;
      padding: 14px 32px;
      font-family: var(--mono); font-size: 0.9rem; font-weight: 700;
      cursor: pointer; letter-spacing: 0.5px;
      transition: transform 0.12s;
    }
    #btn-dismiss:active { transform: scale(0.97); }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-icon">🎙️</div>
  <div>
    <h1>LEMBRETE POR VOZ</h1>
    <p>ex: "Tomar remédio daqui a 5 minutos"</p>
  </div>
  <div id="wakelock-dot">
    <div class="dot"></div>
    <span id="wl-label">wake</span>
  </div>
</header>

<!-- MAIN -->
<main>
  <!-- Botão falar -->
  <button id="btn-falar">
    <span id="btn-icon">🎤</span>
    <span id="btn-label">FALAR</span>
    <div class="mic-waves">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </button>

  <div id="status-texto">pronto para ouvir…</div>

  <!-- Status do sistema -->
  <div id="sys-bar" class="warn">
    <div class="sys-dot"></div>
    <span class="sys-label" id="sys-label">verificando</span>
    <span class="sys-msg" id="sys-msg"></span>
    <button id="btn-notif" onclick="pedirNotificacao()">permitir notif</button>
  </div>

  <!-- Lista -->
  <div class="section-title">Agendados</div>
  <div id="lista-lembretes">
    <div class="empty" id="empty-msg">nenhum lembrete ainda</div>
  </div>
</main>

<!-- ALARM OVERLAY (tela aberta) -->
<div id="alarm-overlay">
  <div id="alarm-ring">🔔</div>
  <div id="alarm-texto">Lembrete!</div>
  <button id="btn-dismiss" onclick="dispensarAlarme()">OK, ENTENDI</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  WEB AUDIO — gera beep sintetizado (não precisa de arquivo)
// ═══════════════════════════════════════════════════════
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function tocarBeep(vezes = 3) {
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();

  for (let i = 0; i < vezes; i++) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.type = 'sine';
    osc.frequency.value = 880;

    const t = ctx.currentTime + i * 0.55;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.4, t + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);

    osc.start(t);
    osc.stop(t + 0.45);
  }
}

// "Unlock" AudioContext no primeiro toque (necessário no iOS)
document.addEventListener('touchstart', () => {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: false, passive: true });

// ═══════════════════════════════════════════════════════
//  WAKE LOCK — mantém tela viva
// ═══════════════════════════════════════════════════════
let wakeLock = null;

async function ativarWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    setWakeLockUI(true);
    wakeLock.addEventListener('release', () => {
      setWakeLockUI(false);
      // Re-adquire se a página ficar visível novamente
    });
  } catch(e) {
    setWakeLockUI(false);
  }
}

function setWakeLockUI(ativo) {
  const el = document.getElementById('wakelock-dot');
  const lb = document.getElementById('wl-label');
  if (ativo) { el.classList.add('active'); lb.textContent = 'wake'; }
  else        { el.classList.remove('active'); lb.textContent = 'wake'; }
}

// Re-adquire wake lock quando a aba volta a ficar visível
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wakeLock === null) {
    await ativarWakeLock();
  }
});

// ═══════════════════════════════════════════════════════
//  NOTIFICAÇÕES (complementar — aviso em segundo plano)
// ═══════════════════════════════════════════════════════
async function pedirNotificacao() {
  const r = await Notification.requestPermission();
  atualizarSysBar();
  // unloca áudio junto
  getAudioCtx();
}

function dispararNotifNativa(texto) {
  if (Notification.permission === 'granted') {
    try {
      new Notification('🔔 Lembrete', {
        body: texto,
        requireInteraction: true,
      });
    } catch(e) {}
  }
}

// ═══════════════════════════════════════════════════════
//  STATUS BAR
// ═══════════════════════════════════════════════════════
function atualizarSysBar() {
  const perm = typeof Notification !== 'undefined' ? Notification.permission : 'unsupported';
  const wl   = ('wakeLock' in navigator);
  const bar  = document.getElementById('sys-bar');
  const lbl  = document.getElementById('sys-label');
  const msg  = document.getElementById('sys-msg');
  const btn  = document.getElementById('btn-notif');

  if (perm === 'granted' && wl) {
    bar.className = 'ok';
    lbl.textContent = 'sistema ativo';
    msg.textContent = '— wake lock + som garantidos';
    btn.classList.remove('show');
  } else if (perm === 'denied') {
    bar.className = 'err';
    lbl.textContent = 'notif bloqueada';
    msg.textContent = '— ative nas configs do browser';
    btn.classList.remove('show');
  } else if (perm === 'default') {
    bar.className = 'warn';
    lbl.textContent = 'sem notificação';
    msg.textContent = '— alarme só com tela aberta';
    btn.classList.add('show');
  } else {
    bar.className = 'warn';
    lbl.textContent = 'modo básico';
    msg.textContent = '— mantenha a tela aberta';
    btn.classList.remove('show');
  }
}

// ═══════════════════════════════════════════════════════
//  RECONHECIMENTO DE VOZ
// ═══════════════════════════════════════════════════════
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let ouvindo = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    ouvindo = true;
    document.getElementById('btn-falar').classList.add('ouvindo');
    document.getElementById('btn-icon').textContent = '⏹';
    document.getElementById('btn-label').textContent = 'PARAR';
    setStatus('ouvindo…', 'ativo');
    // Desbloqueia AudioContext no momento do toque
    getAudioCtx();
  };

  recognition.onresult = (e) => {
    const r = e.results[e.results.length - 1];
    const texto = r[0].transcript;
    setStatus(texto, 'ativo');
    if (r.isFinal) processarVoz(texto);
  };

  recognition.onend = () => {
    ouvindo = false;
    document.getElementById('btn-falar').classList.remove('ouvindo');
    document.getElementById('btn-icon').textContent = '🎤';
    document.getElementById('btn-label').textContent = 'FALAR';
  };

  recognition.onerror = (e) => {
    setStatus('erro: ' + e.error, 'warn');
  };
}

document.getElementById('btn-falar').addEventListener('click', () => {
  if (!recognition) { setStatus('reconhecimento de voz não suportado', 'warn'); return; }
  // Desbloqueia AudioContext no toque
  getAudioCtx();
  if (ouvindo) recognition.stop();
  else recognition.start();
});

function setStatus(txt, cls = '') {
  const el = document.getElementById('status-texto');
  el.textContent = txt;
  el.className = cls;
}

// ═══════════════════════════════════════════════════════
//  PARSER DE TEMPO
// ═══════════════════════════════════════════════════════
function parsearTempo(texto) {
  const t = texto.toLowerCase()
    .replace('daqui a', 'daqui a')
    .replace('daqui à', 'daqui a');

  const regras = [
    { re: /daqui\s+a?\s+(\d+)\s*(hora|horas|hr|h)\b/,        mult: 3600000 },
    { re: /daqui\s+a?\s+(\d+)\s*(minuto|minutos|min|m)\b/,   mult: 60000   },
    { re: /daqui\s+a?\s+(\d+)\s*(segundo|segundos|seg|s)\b/,  mult: 1000    },
    { re: /em\s+(\d+)\s*(hora|horas|hr|h)\b/,                mult: 3600000 },
    { re: /em\s+(\d+)\s*(minuto|minutos|min|m)\b/,           mult: 60000   },
    { re: /em\s+(\d+)\s*(segundo|segundos|seg|s)\b/,          mult: 1000    },
    { re: /(\d+)\s*(hora|horas|hr|h)\b/,                     mult: 3600000 },
    { re: /(\d+)\s*(minuto|minutos|min)\b/,                  mult: 60000   },
    { re: /(\d+)\s*(segundo|segundos|seg)\b/,                 mult: 1000    },
    // extenso
    { re: /meia\s+hora/,      ms: 1800000 },
    { re: /uma\s+hora/,       ms: 3600000 },
    { re: /um\s+minuto/,      ms: 60000   },
    { re: /dois\s+minutos/,   ms: 120000  },
    { re: /trinta\s+segundos/,ms: 30000   },
  ];

  for (const r of regras) {
    const m = t.match(r.re);
    if (m) {
      if (r.ms) return r.ms;
      return parseInt(m[1]) * r.mult;
    }
  }
  return null;
}

// ═══════════════════════════════════════════════════════
//  LEMBRETES
// ═══════════════════════════════════════════════════════
const lembretes = [];
const timers = {};

function processarVoz(texto) {
  const ms = parsearTempo(texto);
  const agora = new Date();
  const hora = `${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}`;

  const id = Date.now();
  const item = { id, texto, hora, ms, disparado: false };
  lembretes.unshift(item);
  renderizarLista();

  if (ms) {
    agendarLembrete(item);
    setStatus(`✓ agendado: "${texto}"`, 'ok');
  } else {
    setStatus(`! sem tempo detectado: "${texto}"`, 'warn');
  }
}

function agendarLembrete(item) {
  // setTimeout NA PÁGINA (confiável enquanto tela estiver viva)
  timers[item.id] = setTimeout(() => disparar(item), item.ms);

  // Countdown visual
  iniciarCountdown(item);
}

function disparar(item) {
  item.disparado = true;
  clearInterval(item._interval);
  renderizarLista();

  // 1. Som via Web Audio (funciona sem arquivo externo)
  tocarBeep(4);

  // 2. Vibração
  if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 800, 150, 400]);

  // 3. Overlay visual (se tela aberta)
  mostrarAlarme(item.texto);

  // 4. Notificação nativa (se tela minimizada)
  dispararNotifNativa(item.texto);
}

// ── Alarm overlay ──
let alarmeTexto = '';
function mostrarAlarme(texto) {
  alarmeTexto = texto;
  document.getElementById('alarm-texto').textContent = texto;
  document.getElementById('alarm-overlay').classList.add('show');
  // Toca beep extra quando overlay aparece
  setTimeout(() => tocarBeep(2), 600);
}
function dispensarAlarme() {
  document.getElementById('alarm-overlay').classList.remove('show');
}

// ── Countdown ──
function iniciarCountdown(item) {
  const fim = Date.now() + item.ms;
  item._interval = setInterval(() => {
    const resto = fim - Date.now();
    if (resto <= 0) { clearInterval(item._interval); return; }
    const el = document.getElementById('badge-' + item.id);
    if (el) el.textContent = formatarResto(resto);
  }, 500);
}

function formatarResto(ms) {
  const s = Math.ceil(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60), ss = s % 60;
  if (m < 60) return m + 'min' + (ss ? ' ' + ss + 's' : '');
  const h = Math.floor(m / 60), mm = m % 60;
  return h + 'h' + (mm ? ' ' + mm + 'min' : '');
}

// ── Render ──
function renderizarLista() {
  const el = document.getElementById('lista-lembretes');
  el.innerHTML = '';

  if (lembretes.length === 0) {
    el.innerHTML = '<div class="empty" id="empty-msg">nenhum lembrete ainda</div>';
    return;
  }

  lembretes.forEach(item => {
    const card = document.createElement('div');
    card.className = 'lembrete-card' + (item.disparado && !item._shown ? ' disparando' : '');
    if (item.disparado) item._shown = true;

    const time = document.createElement('span');
    time.className = 'card-time';
    time.textContent = item.hora;

    const txt = document.createElement('span');
    txt.className = 'card-text';
    txt.textContent = item.texto;

    card.appendChild(time);
    card.appendChild(txt);

    if (!item.ms) {
      const b = document.createElement('span');
      b.className = 'badge badge-notime';
      b.textContent = '?tempo';
      card.appendChild(b);
    } else if (item.disparado) {
      const b = document.createElement('span');
      b.className = 'badge badge-fired';
      b.textContent = '✓ ok';
      card.appendChild(b);
    } else {
      const b = document.createElement('span');
      b.className = 'badge badge-countdown';
      b.id = 'badge-' + item.id;
      b.textContent = formatarResto(item.ms);
      card.appendChild(b);
    }

    el.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
(async () => {
  await ativarWakeLock();
  atualizarSysBar();
  renderizarLista();
})();
</script>
