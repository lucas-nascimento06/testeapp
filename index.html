<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lembrete por Voz</title>
  <link rel="manifest" href="manifest.json" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 40px 20px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 24px;
      color: #222;
    }

    h2 {
      font-size: 20px;
      margin: 30px 0 12px;
      color: #333;
    }

    #btnFalar {
      font-size: 22px;
      padding: 18px 40px;
      border: none;
      border-radius: 12px;
      background: #007bff;
      color: white;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    #btnFalar:hover {
      background: #0069d9;
    }

    #btnFalar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #texto {
      margin-top: 20px;
      font-size: 20px;
      color: #333;
      min-height: 28px;
      font-style: italic;
    }

    #status {
      margin-top: 10px;
      font-size: 15px;
      color: #28a745;
      min-height: 20px;
    }

    #status.erro {
      color: #dc3545;
    }

    #lista {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-lembrete {
      font-size: 16px;
      background: white;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .item-hora {
      font-size: 13px;
      color: #888;
      white-space: nowrap;
    }

    .item-texto {
      flex: 1;
      color: #333;
    }

    .item-badge {
      font-size: 12px;
      background: #d4edda;
      color: #155724;
      padding: 3px 10px;
      border-radius: 99px;
      white-space: nowrap;
    }

    #vazio {
      font-size: 15px;
      color: #999;
      padding: 20px 0;
    }
  </style>
</head>

<body>

  <h1>🎙️ Lembrete por Voz</h1>

  <button id="btnFalar" onclick="falar()">🎤 Falar</button>

  <div id="texto"></div>
  <div id="status"></div>

  <h2>📋 Lembretes</h2>
  <div id="lista"></div>
  <div id="vazio">Nenhum lembrete ainda.</div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let ouvindo = false;

    // Solicitar permissão de notificação ao carregar
    if (Notification && Notification.permission === "default") {
      Notification.requestPermission();
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        ouvindo = true;
        setStatus("🎙️ Ouvindo...", false);
        document.getElementById("texto").textContent = "";
        document.getElementById("btnFalar").disabled = true;
      };

      recognition.onend = () => {
        ouvindo = false;
        document.getElementById("btnFalar").disabled = false;
      };

      recognition.onerror = (event) => {
        ouvindo = false;
        document.getElementById("btnFalar").disabled = false;

        const msgs = {
          "not-allowed": "❌ Permissão de microfone negada.",
          "no-speech": "⚠️ Nenhuma fala detectada. Tente novamente.",
          "network": "❌ Erro de rede. Verifique a conexão.",
          "aborted": "⚠️ Reconhecimento cancelado.",
          "audio-capture": "❌ Microfone não encontrado.",
          "service-not-allowed": "❌ Serviço de voz não permitido.",
        };

        setStatus(msgs[event.error] || "❌ Erro: " + event.error, true);
      };

      recognition.onresult = (event) => {
        const textoFalado = event.results[0][0].transcript;
        document.getElementById("texto").textContent = "\"" + textoFalado + "\"";
        salvar(textoFalado);
        criarAlarme(textoFalado);
      };

    } else {
      setStatus("❌ Seu navegador não suporta reconhecimento de voz.", true);
      document.getElementById("btnFalar").disabled = true;
    }

    // ── Funções principais ──────────────────────────────────────────

    function falar() {
      if (ouvindo) return;
      setStatus("", false);
      try {
        recognition.start();
      } catch (e) {
        setStatus("⚠️ Tente novamente.", true);
      }
    }

    function setStatus(msg, isErro) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = isErro ? "erro" : "";
    }

    // ── localStorage ────────────────────────────────────────────────

    function carregarLembretes() {
      try {
        return JSON.parse(localStorage.getItem("lembretes")) || [];
      } catch {
        return [];
      }
    }

    function salvarLembretes(dados) {
      localStorage.setItem("lembretes", JSON.stringify(dados));
    }

    function salvar(texto) {
      const dados = carregarLembretes();
      const hora = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      dados.unshift({ texto, hora, alarme: null });
      salvarLembretes(dados);
      renderLista();
    }

    function marcarAlarme(texto, minutos) {
      const dados = carregarLembretes();
      const item = dados.find(d => d.texto === texto && d.alarme === null);
      if (item) {
        item.alarme = minutos;
        salvarLembretes(dados);
        renderLista();
      }
    }

    // ── Renderização ────────────────────────────────────────────────

    function renderLista() {
      const dados = carregarLembretes();
      const lista = document.getElementById("lista");
      const vazio = document.getElementById("vazio");

      lista.innerHTML = "";

      if (dados.length === 0) {
        vazio.style.display = "block";
        return;
      }

      vazio.style.display = "none";

      dados.forEach(item => {
        const div = document.createElement("div");
        div.className = "item-lembrete";
        div.innerHTML = `
          <span class="item-hora">${item.hora}</span>
          <span class="item-texto">${item.texto}</span>
          ${item.alarme ? `<span class="item-badge">⏰ ${item.alarme} min</span>` : ""}
        `;
        lista.appendChild(div);
      });
    }

    // ── Extração de tempo ───────────────────────────────────────────

    function extrairMinutos(texto) {
      const t = texto.toLowerCase();

      const porExtenso = {
        "um": 1, "uma": 1,
        "dois": 2, "duas": 2,
        "três": 3, "tres": 3,
        "quatro": 4,
        "cinco": 5,
        "seis": 6,
        "sete": 7,
        "oito": 8,
        "nove": 9,
        "dez": 10,
        "onze": 11,
        "doze": 12,
        "treze": 13,
        "catorze": 14, "quatorze": 14,
        "quinze": 15,
        "vinte": 20,
        "trinta": 30,
        "quarenta": 40,
        "cinquenta": 50
      };

      for (const [palavra, valor] of Object.entries(porExtenso)) {
        if (new RegExp(palavra + "\\s*minuto").test(t)) return valor;
      }

      const matchDigito = t.match(/(\d+)\s*minuto/);
      if (matchDigito) return parseInt(matchDigito[1]);

      return null;
    }

    // ── Alarme ──────────────────────────────────────────────────────

    function criarAlarme(texto) {
      const minutos = extrairMinutos(texto);

      if (!minutos) {
        setStatus("✅ Lembrete salvo (nenhum tempo detectado).", false);
        return;
      }

      setStatus(`✅ Alarme criado! Você será lembrado em ${minutos} minuto(s).`, false);
      marcarAlarme(texto, minutos);

      setTimeout(() => {
        dispararNotificacao(texto);
      }, minutos * 60 * 1000);
    }

    function dispararNotificacao(texto) {
      if (!Notification) {
        alert("🔔 Lembrete: " + texto);
        return;
      }

      if (Notification.permission === "granted") {
        // Tenta via Service Worker (melhor suporte mobile)
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification("🔔 Lembrete", {
              body: texto,
              icon: "icon.png",
              vibrate: [200, 100, 200]
            });
          });
        } else {
          new Notification("🔔 Lembrete", { body: texto });
        }
      } else if (Notification.permission === "default") {
        Notification.requestPermission().then(p => {
          if (p === "granted") {
            new Notification("🔔 Lembrete", { body: texto });
          } else {
            alert("🔔 Lembrete: " + texto);
          }
        });
      } else {
        alert("🔔 Lembrete: " + texto);
      }
    }

    // ── Init ────────────────────────────────────────────────────────
    renderLista();
  </script>

</body>
</html>
