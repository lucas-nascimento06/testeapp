<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Lembrete por Voz</title>

  <link rel="manifest" href="manifest.json" />

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
      background: #f5f5f5;
    }

    button {
      font-size: 24px;
      padding: 20px;
      border: none;
      border-radius: 10px;
      background: #007bff;
      color: white;
    }

    #texto {
      margin-top: 30px;
      font-size: 28px;
    }

    #lista {
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <h1>🎙️ Fale seu lembrete</h1>
  <button onclick="falar()">Falar</button>

  <div id="texto">Clique e fale...</div>

  <h2>📋 Lembretes</h2>
  <div id="lista"></div>

  <script>
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";

      recognition.onresult = (event) => {
        const textoFalado = event.results[0][0].transcript;

        texto.innerText = textoFalado;

        salvar(textoFalado);
        mostrar();
        criarAlarme(textoFalado);
      };
    }

    function falar() {
      recognition.start();
    }

    // salvar
    function salvar(texto) {
      const dados = JSON.parse(localStorage.getItem("lembretes")) || [];
      dados.push({ texto });
      localStorage.setItem("lembretes", JSON.stringify(dados));
    }

    // mostrar
    function mostrar() {
      const dados = JSON.parse(localStorage.getItem("lembretes")) || [];
      lista.innerHTML = "";

      dados.forEach((item) => {
        const p = document.createElement("p");
        p.innerText = item.texto;
        lista.appendChild(p);
      });
    }

    // extrair minutos (ex: "em 5 minutos")
    function extrairMinutos(texto) {
      const match = texto.match(/(\d+)\s*min/);
      return match ? parseInt(match[1]) : null;
    }

    // criar alarme
    function criarAlarme(texto) {
      const minutos = extrairMinutos(texto);

      if (!minutos) return;

      const tempo = minutos * 60 * 1000;

      setTimeout(() => {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification("🔔 Lembrete", {
            body: texto,
            vibrate: [500, 200, 500, 200, 1000],
            tag: "lembrete"
          });
        });
      }, tempo);
    }

    window.onload = () => {
      mostrar();
      Notification.requestPermission();
    };

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

</body>
</html>
